# v1.4

on: [push] 

jobs:
  codespace:
    name: Create configuration for Codespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create Codespace for testing phpBB Extension
        id: create-codespace
        uses: battye/phpbb-extension-tester@main
        with:
          source-branch: '3.3.x'
          destination-branch: 'codespace-test'
